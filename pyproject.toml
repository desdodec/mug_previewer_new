[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mug-previewer"
version = "0.1.0rc1"
description = "Dataset-driven foundations for Mug Previewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.7",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mug-previewer = "mug_previewer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mug_previewer.providers" = ["profiles/*.json"]
"mug_previewer.preview" = ["assets/*.png"]
"mug_previewer.ui" = ["manual_review_scope.json"]